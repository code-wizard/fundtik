{% extends "main/base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>{{ action }} Staff</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">{{ action }}</button>
        <a href="{% url 'staff_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
